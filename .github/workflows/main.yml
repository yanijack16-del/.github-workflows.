
name: Novaler MultiboxPro - OpenPLi Scarthgap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install OpenPLi build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs subversion cvs gettext \
            build-essential gcc g++ make \
            python3 python3-distutils \
            wget curl unzip zip \
            gawk diffstat texinfo \
            chrpath socat cpio \
            file lz4 libssl-dev \
            libproc-processtable-perl \
            rpcsvc-proto desktop-file-utils \
            default-jre

      - name: Clone OpenPLi Scarthgap
        run: |
          git clone https://github.com/OpenPLi/openpli-oe-core.git
          cd openpli-oe-core
          git checkout scarthgap

      - name: Initialize OpenPLi
        run: |
          cd openpli-oe-core
          make init
          make update

      - name: Verify Novaler machine support
        run: |
          cd openpli-oe-core

          echo "Checking multiboxpro machine..."

          MACHINE_CONF="meta-maxytec/conf/machine/multiboxpro.conf"

          if [ ! -f "$MACHINE_CONF" ]; then
            echo "ERROR: multiboxpro machine configuration missing"
            exit 1
          fi

          echo "Machine configuration found:"
          cat "$MACHINE_CONF"

          echo "Checking kernel recipes..."
          find meta-maxytec -iname '*linux*' -type f

          echo "Checking recovery and image recipes..."
          find meta-maxytec -type f \
            | grep -Ei 'recovery|image|multiboxpro' \
            || true

          echo "Checking chipset..."
          grep -Ri "Hi3798Mv200" meta-maxytec \
            || true

      - name: Build OpenPLi for multiboxpro
        run: |
          cd openpli-oe-core
          MACHINE=multiboxpro make image

      - name: Check build output
        if: always()
        run: |
          echo "=== Available image files ==="
          find openpli-oe-core/build/tmp/deploy/images \
            -type f \
            \( -name '*.zip' -o -name 'uImage' -o -name '*.tar.bz2' \) \
            -print 2>/dev/null || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Novaler-MultiboxPro-OpenPLi-Scarthgap
          path: openpli-oe-core/build/tmp/deploy/images/multiboxpro/
          if-no-files-found: error
          retention-days: 7
