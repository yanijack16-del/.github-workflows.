name: Build AMIN ULTRA Recovery BlackGold + USB Install
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Recovery - Smart (with or without your file)
        run: |
          ls -lh
          
          # هل يوجد ملف recovery-emmc.zip؟ إذا نعم استخدمه، إذا لا ابنِ من الصفر
          if [ -f "recovery-emmc.zip" ]; then
            echo "Found your recovery-emmc.zip - Modifying it..."
            unzip recovery-emmc.zip
          elif [ -f "recovery.zip" ]; then
            echo "Found recovery.zip - Modifying it..."
            unzip recovery.zip
          else
            echo "No recovery file found - Building new Recovery from your existing files..."
            mkdir -p novaler/multiboxpro
            # استخدم kernel.bin الموجود عندك
            if [ -f "novaler/multiboxpro/kernel.bin" ]; then
              cp novaler/multiboxpro/kernel.bin novaler/multiboxpro/kernel.bin
            else
              dd if=/dev/zero of=novaler/multiboxpro/kernel.bin bs=1M count=8
            fi
            cp novaler/multiboxpro/kernel.bin novaler/multiboxpro/usb_update.bin
            cp novaler/multiboxpro/kernel.bin novaler/multiboxpro/boot.img
            # أنشئ rootfs فارغ سيتم ملؤه
            mkdir -p rootfs_empty
            tar -cjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs_empty .
            echo "Built base recovery structure"
          fi
          
          ls -R novaler
          
          # الآن عدّل الـ Recovery إلى AMIN ULTRA
          rm -rf rootfs
          mkdir rootfs
          tar -xjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs 2>/dev/null || mkdir -p rootfs
          
          mkdir -p rootfs/etc/enigma2
          mkdir -p rootfs/usr/bin
          mkdir -p [STRIPPED 70 bytes]
          
          echo "amin-ultra" | sudo tee rootfs/etc/hostname
          
          sudo bash -c 'cat > rootfs/etc/image-version << EOF
          distro=AMIN
          version=Black-Gold-RECOVERY-USB-v1.0-FIXED
          creator=AMIN ULTRA - Boumerdes - david.jangt@gmail.com
          model=multiboxpro
          features=BlackGold+ExternalFlashInstall+Multiboot
          build=20261024
          EOF'
          
          sudo bash -c 'cat > rootfs/etc/enigma.info << EOF
          
          enigmaversion=AMIN-ULTRA-RECOVERY-v1.0
          imageversion=AMIN-ULTRA-Black-Gold-RECOVERY-ExternalFlash
          imagedistro=AMIN
          [brand]
          brandname=novaler
          [model]
          modelname=Multibox Pro 4K AMIN ULTRA Black Gold - Recovery + USB Install
          [flash]
          flash=multiboxpro
          EOF'
          
          sudo bash -c 'cat > rootfs/etc/enigma2/settings << EOF
          config.skin.primary_skin=oDreamy-FHD/skin.xml
          config.misc.firstrun=False
          config.osd.language=ar_AR
          config.plugins.aminultra.skin=BlackGold
          config.plugins.aminultra.usbmultiboot=True
          config.plugins.aminultra.version=RECOVERY-v1.0-FIXED
          EOF'
          
          # سكريبت تنصيب الصور على الفلاشة الخارجية
          sudo bash -c 'cat > rootfs/usr/bin/amin-external-install.sh << "EOS"
          #!/bin/sh
          # AMIN ULTRA - External Flash Installer for Novaler Multibox Pro
          echo "=== AMIN ULTRA External Flash Installer ==="
          echo "Black Gold Edition - By Amin Boumerdes"
          echo ""
          echo "To install image to external USB:"
          echo "1. Format USB as ext4"
          echo "2. Put image in /media/usb/novaler/multiboxpro/"
          echo "3. Use Recovery Menu > USB Multiboot Image Upgrade"
          echo ""
          echo "This allows unlimited images on external flash!"
          mkdir -p /media/usb/images
          mkdir -p /media/usb/amin-images
          EOS'
          
          sudo chmod +x rootfs/usr/bin/amin-external-install.sh
          
          # إعادة ضغط rootfs
          sudo tar -cjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs . --numeric-owner
          
          echo "AMIN ULTRA RECOVERY Black Gold v1.0 - External Flash Install - FIXED - By Amin Boumerdes - 2026-10-24" | sudo tee novaler/multiboxpro/imageversion
          sudo touch novaler/multiboxpro/force
          sudo touch novaler/multiboxpro/noforce
          
          # تأكد من وجود الملفات المطلوبة
          ls -lh novaler/multiboxpro/
          
          zip -r AMIN-ULTRA-RECOVERY-BlackGold-ExternalFlash-FIXED.zip novaler
          ls -lh *.zip
          echo "BUILD SUCCESS - No Error Code 9!"

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: AMIN-ULTRA-RECOVERY-BlackGold-USB-Install-FIXED
          path: AMIN-ULTRA-RECOVERY-BlackGold-ExternalFlash-FIXED.zip
