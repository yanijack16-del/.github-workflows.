name: AMIN ULTRA Enigma2 Black Gold + USB Flash Support
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - name: Build Image with USB Flash Disk Support
        run: |
          mkdir -p multiboxpro
          mkdir -p enigma2_plugins/Extensions/OpenMultiboot
          
          # سكريبت دعم الفلاش ديسك (ما لا يدعمه Novaler)
          cat > multiboxpro/amin_usb_flash_installer.sh << 'EOF'
          #!/bin/sh
          echo "AMIN ULTRA - Enabling USB Flash Disk Support"
          modprobe usb-storage 2>/dev/null
          mkdir -p /media/usb_flash
          mount /dev/sda1 /media/usb_flash 2>/dev/null
          mkdir -p /media/usb_flash/open-multiboot
          echo "USB Flash Disk Support Enabled!"
          EOF
          chmod +x multiboxpro/amin_usb_flash_installer.sh
          
          zip -r AMIN-ULTRA-BlackGold-USB-Flash.zip multiboxpro
            - uses: actions/upload-artifact@v4
        with:
          name: AMIN-ULTRA-BlackGold-USB-Flash
          path: AMIN-ULTRA-BlackGold-USB-Flash.zip
