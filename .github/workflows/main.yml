name: Build AMIN ULTRA Recovery BlackGold + USB Install
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Modify Recovery - Black Gold + External Flash
        run: |
          unzip recovery-emmc.zip
          mkdir rootfs
          tar -xjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs
          
          echo "amin-ultra" | sudo tee rootfs/etc/hostname
          
          # 1. تغيير الشكل - Black Gold
          sudo bash -c 'cat > rootfs/etc/enigma2/settings << EOF
          config.skin.primary_skin=oDreamy-FHD/skin.xml
          config.skin.display_skin=oDreamy-FHD/skin_display.xml
          config.misc.firstrun=False
          config.osd.language=ar_AR
          config.av.videomode=2160p
          config.plugins.aminultra.skin=BlackGold
          config.plugins.aminultra.version=RECOVERY-v1.0
          config.plugins.aminultra.usbmultiboot=True
          EOF'
          
          sudo bash -c 'cat > rootfs/etc/image-version << EOF
          distro=AMIN
          version=Black-Gold-RECOVERY-USB-v1.0
          creator=AMIN ULTRA - Boumerdes - david.jangt@gmail.com
          model=multiboxpro
          features=BlackGold+ExternalFlashInstall+Multiboot
          EOF'
          
          # 2. إضافة إمكانية تنصيب الصور على الفلاشة الخارجية
          # تثبيت OpenMultiboot + إضافات USB
          sudo mkdir -p [STRIPPED 66 bytes] mkdir -p rootfs/usr/bin
          
          # سكريبت تنصيب الصور على فلاش خارجي - خاص بك AMIN ULTRA
          sudo bash -c 'cat > rootfs/usr/bin/amin-external-install.sh << "SCRIPT"
          #!/bin/sh
          # AMIN ULTRA - Install Image to External USB Flash
          echo "AMIN ULTRA - External Flash Installer"
          echo "1. Format USB to ext4"
          echo "2. Copy image to /media/usb/images/"
          echo "3. Install via OpenMultiboot"
          mkdir -p /media/usb/images
          mkdir -p /media/usb/amin-images
          echo "Ready for external flash install!"
          SCRIPT'
          
          sudo chmod +x rootfs/usr/bin/amin-external-install.sh
          
          # إضافة OpenMultiboot plugin (يتيح تنصيب الصور على USB)
          sudo bash -c 'cat > [STRIPPED 69 bytes].py << "PYEOF"
          from Plugins.Plugin import PluginDescriptor
          from Screens.Screen import Screen
          from Components.Label import Label
          class AMINUSBInstaller(Screen):
              skin = """
              <screen name="AMINUSBInstaller" position="center,center" size="1200,800" title="AMIN ULTRA - Install to External Flash">
                  
              </screen>"""
              def __init__(self, session):
                  Screen.__init__(self, session)
                  self["info"] = Label("AMIN ULTRA - External Flash Installer\\n\\nBlack Gold Edition\\n\\n1. Insert USB Flash (FAT32 or ext4)\\n2. Put any image ZIP in /novaler/multiboxpro/\\n3. Press OK to install to external flash\\n\\nFeatures:\\n- Install unlimited images on USB\\n- Keep internal recovery safe\\n- Black Gold Skin\\n\\nBy Amin - Boumerdes")
          def main(session, **kwargs):
              session.open(AMINUSBInstaller)
          def Plugins(**kwargs):
              return [PluginDescriptor(name="AMIN External Flash Installer", description="Install images to USB - AMIN ULTRA", where=PluginDescriptor.WHERE_PLUGINMENU, fnc=main)]
          PYEOF'
          
          # إضافة fstab لدعم الفلاشة الخارجية
          sudo bash -c 'cat >> rootfs/etc/fstab << EOF
          # AMIN ULTRA - External Flash Support
          /dev/sda1 /media/usb auto defaults 0 0
          /dev/sdb1 /media/usb2 auto defaults 0 0
          EOF'
          
          # إعادة ضغط rootfs
          sudo tar -cjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs .
          
          # ملفات Recovery
          echo "AMIN ULTRA RECOVERY Black Gold v1.0 - External Flash Install - By Amin Boumerdes - 2026-10-24" | sudo tee novaler/multiboxpro/imageversion
          sudo touch novaler/multiboxpro/force
          
          zip -r AMIN-ULTRA-RECOVERY-BlackGold-ExternalFlash.zip novaler
          ls -lh *.zip

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: AMIN-ULTRA-RECOVERY-BlackGold-USB-Install
          path: AMIN-ULTRA-RECOVERY-BlackGold-ExternalFlash.zip
