name: Build AMIN ULTRA Full Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download REAL OpenATV Full Image for Multibox Pro
        run: |
          # رابط رسمي مباشر
          wget --no-check-certificate -O recovery.zip https://images.mynonpublic.com/openatv/7.5/multiboxpro/openatv-7.5-multiboxpro_recovery_emmc.zip || \
          wget --no-check-certificate -O recovery.zip https://images.mynonpublic.com/openatv/current/multiboxpro/openatv-7.5-multiboxpro_recovery_emmc.zip
          unzip -l recovery.zip
          unzip recovery.zip
          ls -R novaler

      - name: Modify to AMIN ULTRA - Your Own Image
        run: |
          sudo apt-get update && sudo apt-get install -y bzip2
          
          # فك rootfs الأصلية
          mkdir rootfs
          tar -xjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs --numeric-owner || tar -xjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs
          
          # 1. تغيير اسم الجهاز إلى AMIN
          echo "amin-ultra" | sudo tee rootfs/etc/hostname
          
          # 2. تغيير معلومات الصورة
          sudo bash -c 'cat > rootfs/etc/image-version << EOF
          distro=AMIN
          version=Black-Gold-v1.0-REAL-FULL
          creator=AMIN ULTRA Team - Amin - david.jangt@gmail.com
          model=multiboxpro
          machine=multiboxpro
          imageversion=AMIN-ULTRA-v1.0
          imagebuild=20261024
          EOF'
          
          sudo bash -c 'cat > rootfs/etc/enigma.info << EOF
          
          enigmaversion=AMIN-ULTRA-v1.0-FULL
          imageversion=AMIN-ULTRA-Black-Gold-REAL
          imagedistro=AMIN
          [brand]
          brandname=novaler
          [model]
          modelname=Multibox Pro 4K AMIN ULTRA Black Gold
          modelnumber=multiboxpro
          [flash]
          flash=multiboxpro
          EOF'
          
          # 3. وضع سكنك الأسود الذهبي كافتراضي
          sudo mkdir -p rootfs/etc/enigma2
          sudo bash -c 'echo "config.skin.primary_skin=oDreamy-FHD/skin.xml" >> rootfs/etc/enigma2/settings'
          sudo bash -c 'echo "config.misc.firstrun=False" >> rootfs/etc/enigma2/settings'
          sudo bash -c 'echo "config.misc.languageselected=False" >> rootfs/etc/enigma2/settings'
          sudo bash -c 'echo "config.osd.language=ar_AR" >> rootfs/etc/enigma2/settings'
          
          # 4. تغيير شاشة الإقلاع إلى AMIN
          sudo mkdir -p rootfs/usr/share/enigma2
          sudo bash -c 'cat > rootfs/usr/share/enigma2/skin_display.xml << EOF
          <skin><screen name="BootLogo" position="0,0" size="1920,1080" backgroundColor="#000000"><label text="AMIN ULTRA 4K PRO - Black Gold Edition" position="center,800" size="1200,80" font="Regular;50" foregroundColor="#FFD700" halign="center"/><label text="Built by Amin - REAL FULL IMAGE" position="center,900" size="1000,50" font="Regular;35" foregroundColor="#FFFFFF" halign="center"/></screen></skin>
          EOF'
          
          # 5. إعادة ضغط rootfs
          sudo tar -cjf novaler/multiboxpro/rootfs.tar.bz2 -C rootfs . --numeric-owner
          
          # 6. ملفات الفلاش
          echo "AMIN ULTRA v1.0 REAL FULL - Black Gold - Built 2026-10-24 - For MultiboxPro - By Amin" | sudo tee novaler/multiboxpro/imageversion
          sudo touch novaler/multiboxpro/force
          
          # 7. إنشاء ملف USB النهائي
          zip -r AMIN-ULTRA-v1.0-FULL-REAL-BOOTABLE-multiboxpro.zip novaler
          ls -lh *.zip
          echo "SIZE:"
          du -h AMIN-ULTRA-v1.0-FULL-REAL-BOOTABLE-multiboxpro.zip

      - name: Upload FULL REAL Image
        uses: actions/upload-artifact@v4
        with:
          name: AMIN-ULTRA-FULL-REAL-BOOTABLE-300MB
          path: AMIN-ULTRA-v1.0-FULL-REAL-BOOTABLE-multiboxpro.zip
