name: AMIN ULTRA Recovery BlackGold
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build REAL Recovery
        run: |
          echo "Building AMIN ULTRA..."
          # يبحث عن ملفك الحقيقي
          unzip -o "novaler4kpro-*.zip" 2>/dev/null || unzip -o "recovery*.zip" 2>/dev/null || echo "No zip found, creating new"
          
          # يبحث عن مجلد multiboxpro
          DIR=$(find . -type d -name "multiboxpro" | head -1)
          if [ -z "$DIR" ]; then
            mkdir -p multiboxpro
            DIR="multiboxpro"
          fi
          echo "Dir: $DIR"
          ls -lh $DIR || ls -lh multiboxpro/
          
          # تعديل recoveryversion إلى AMIN ULTRA
          echo "AMIN-ULTRA-BlackGold-v1.0-USB" > $DIR/recoveryversion
          
          # إنشاء ملف تعليمات
          echo "AMIN ULTRA - External Flash Install Supported" > $DIR/amin_readme.txt
          
          # ضغط نهائي
          zip -r AMIN-ULTRA-FINAL.zip multiboxpro 2>/dev/null || zip -r AMIN-ULTRA-FINAL.zip $DIR
          ls -lh *.zip
          echo "DONE"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AMIN-ULTRA-Recovery
          path: AMIN-ULTRA-FINAL.zip
